# Workflow actions are pinned to commit SHAs so a repointed tag cannot change
# what runs in CI. That trade-off only works if something keeps the pins
# current, which is this file's job.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "python"]
    groups:
      dev-tooling:
        patterns: ["black", "flake8", "isort", "mypy", "pytest*"]

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    labels: ["dependencies", "docker"]
